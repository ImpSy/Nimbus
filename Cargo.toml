[workspace]
resolver = "3"
members = ["crates/xcloud", "crates/media", "crates/nimbus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "form"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
parking_lot = "0.13"
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
mio = { version = "1", features = ["net", "os-poll"] }
if-addrs = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
url = "2"
directories = "6"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Video decode / network loops are hot even in dev; keep deps optimized.
[profile.dev.package."*"]
opt-level = 2
