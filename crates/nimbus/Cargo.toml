[package]
name = "nimbus"
description = "Native, low-latency Xbox Remote Play & Cloud Gaming client"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "nimbus"

[dependencies]
xcloud = { path = "../xcloud" }
nimbus-media = { path = "../media" }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
directories.workspace = true
uuid.workspace = true

# Window + keyboard/mouse (X11 on Linux: Steam Deck game mode runs X11
# clients through gamescope; desktop mode via XWayland).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
# Controllers: IOKit HID on macOS, evdev on Linux (Steam Input's virtual pad).
gilrs = "0.11"
# Audio output: CoreAudio on macOS, ALSA (→ PipeWire) on Linux.
cpal = "0.18"
wgpu = "30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false }
webbrowser = "1"

# Zero-copy video: wrap VideoToolbox's decoded IOSurfaces as wgpu textures.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
