[package]
name = "nimbus"
description = "Native, low-latency Xbox Remote Play & Cloud Gaming client"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "nimbus"

[features]
default = []
# Self-contained release bundles: statically link FFmpeg.
static-ffmpeg-macos = ["nimbus-media/static-ffmpeg-macos"]
static-ffmpeg-linux = ["nimbus-media/static-ffmpeg-linux"]

[dependencies]
xcloud = { path = "../xcloud" }
nimbus-media = { path = "../media" }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
directories.workspace = true
uuid.workspace = true

sdl3 = { version = "0.22", features = ["raw-window-handle", "build-from-source-static"] }
wgpu = "30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false }
webbrowser = "1"
