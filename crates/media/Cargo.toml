[package]
name = "nimbus-media"
description = "Low-latency H.264 / Opus decoding on top of FFmpeg (VideoToolbox, VA-API)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["static"]
# Link the minimal static FFmpeg built by `mise run ffmpeg` (FFMPEG_DIR).
# Disable default features to link a system FFmpeg (>= 5.1) via pkg-config.
static = ["ffmpeg-sys-next/static"]

[dependencies]
# swresample is required by FFmpeg's native Opus decoder.
ffmpeg-sys-next = { version = "9.1", default-features = false, features = ["avcodec", "swresample"] }
libc = "0.2"
thiserror.workspace = true
tracing.workspace = true
